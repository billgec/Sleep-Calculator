<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Ninety" />
    <meta name="theme-color" content="#03040f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ninety finds the best time to go to bed or wake up, using 90-minute sleep cycles and your time to fall asleep."
    />

    <script>
      try {
        if (localStorage.getItem('sleep-calculator:theme') === 'dusk') {
          document.documentElement.dataset.theme = 'dusk'
        }
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
